name: 'Tests'

on:
  workflow_call:
    inputs:
      ref:
        description: 'The seatsio-java ref to test'
        type: string
        default: 'master'
      api-url:
        type: string
        default: 'https://api-staging-na.seatsio.net'
      usage-reporting-tests-api-url:
        type: string
        default: 'https://api-staging-eu.seatsio.net'
      single-run:
        description: 'Run the tests only once, on a single java version (e.g. when used as a smoke test for the server)'
        type: boolean
        default: false
    secrets:
      USAGE_REPORTING_TESTS_SECRET_KEY:
        required: false
      CORE_V2_API_SECRET:
        required: false

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ${{ inputs.single-run && fromJSON('[24]') || fromJSON('[17, 24]') }}

    services:
      httpbin:
        image: mccutchen/go-httpbin:v2.15.0
        ports:
          - 8080:8080

    steps:
    - uses: actions/checkout@v7
      with:
        repository: seatsio/seatsio-java
        ref: ${{ inputs.ref }}
    - uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: ${{ matrix.java-version }}
        cache: 'gradle'
    - run: chmod +x gradlew
    - uses: zcong1993/setup-timezone@master
      with:
        timezone: Europe/Brussels
    - run: ./gradlew build
      env:
        API_URL: ${{ inputs.api-url }}
        USAGE_REPORTING_TESTS_API_URL: ${{ inputs.usage-reporting-tests-api-url }}
        HTTPBIN_URL: http://localhost:8080
        USAGE_REPORTING_TESTS_SECRET_KEY: ${{ secrets.USAGE_REPORTING_TESTS_SECRET_KEY }}
        CORE_V2_API_SECRET: ${{ secrets.CORE_V2_API_SECRET }}
